name: cli

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "cli/**"
      - "server/Dockerfile"
      - "server/docker-compose.yml"
      - "server/go.mod"
      - "server/go.sum"
      - "server/cmd/**"
      - "server/internal/**"
      - "server/migrations/**"
      - "scripts/cli_e2e.py"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "cli/**"
      - "server/Dockerfile"
      - "server/docker-compose.yml"
      - "server/go.mod"
      - "server/go.sum"
      - "server/cmd/**"
      - "server/internal/**"
      - "server/migrations/**"
      - "scripts/cli_e2e.py"
      - ".github/workflows/cli.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p taskmanager-cli --check
      - run: cargo clippy -p taskmanager-cli --all-targets
      - run: cargo test -p taskmanager-cli --all-targets

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: Swatinem/rust-cache@v2
      - name: Run local CLI/server E2E suite
        run: ./scripts/cli_e2e.py
      - name: Collect E2E diagnostics
        if: failure()
        run: |
          mkdir -p cli-e2e-artifacts
          docker ps -a > cli-e2e-artifacts/docker-ps.txt || true
          docker compose -f server/docker-compose.yml logs --no-color > cli-e2e-artifacts/docker-compose.log || true
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-e2e-diagnostics
          path: cli-e2e-artifacts
          if-no-files-found: ignore
