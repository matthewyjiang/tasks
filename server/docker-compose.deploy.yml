services:
  app:
    image: ${TASKS_SERVER_IMAGE:-ghcr.io/matthewyjiang/tasks-server:latest}
    env_file:
      - ${TASKS_SERVER_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind the plaintext Go server to loopback only. Put a TLS-terminating
      # reverse proxy on the host in front of this local port for public access.
      - "127.0.0.1:${HOST_PORT:-18080}:${PORT:-18080}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
