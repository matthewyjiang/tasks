[package]
name = "taskmanager-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "taskmanager"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskmanager-core = { path = "../core" }
thiserror = "1"
uuid = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
