[package]
name = "taskmanager-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "taskmanager"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taskmanager-core = { path = "../core" }
thiserror = "1"
uuid = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
