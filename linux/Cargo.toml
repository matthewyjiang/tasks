[package]
name = "tsk-linux"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "tsk-gui"
path = "src/main.rs"

[features]
default = ["bundled-sqlite", "rustls-tls"]
bundled-sqlite = ["taskmanager-core/bundled-sqlite"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
taskmanager-core = { path = "../core", default-features = false }
gtk4 = { version = "0.9", features = ["v4_6"] }
libadwaita = "0.7"
directories = "5"
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"], default-features = false }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
