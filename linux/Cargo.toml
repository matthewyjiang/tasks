[package]
name = "tsk-linux"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tsk-gui"
path = "src/main.rs"

[dependencies]
taskmanager-core = { path = "../core" }
gtk4 = "0.9"
libadwaita = "0.7"
directories = "5"
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
